<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SSP - Dashboard</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.0/css/all.min.css"
        integrity="sha512-ApSLB1Pd3/bZN8fWB/RG9YhN/7bd9Hkf3AGaE2mPfebjrxagjuBtx2GcgdqIlJkUzwylBo61r9Xa9NmgBI0swA=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="css/responsive.css">
</head>

<body>
    <header>
        <div class="logo">
            <img src="/assets/logo.png" alt="">
        </div>
        <div class="header_search">
            <input type="search" name="header_search" placeholder="Search" id="hd_search">
            <button type="submit">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
        <div class="header_last_things">
            <i class="fa-solid fa-bell"></i>
            <div class="head_profile_section">
                <img src="assets/head_profile_logo.jpg" alt="User Profile Picture">
                <select name="User" id="User">
                    <option value="ramesh">Ramesh</option>
                </select>
            </div>
        </div>
    </header>
</body>

</html>
